<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注册 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-banner">
    <div class="auth-banner-deco d1"></div>
    <div class="auth-banner-deco d2"></div>
    <div class="auth-banner-deco d3"></div>
    <div class="auth-banner-inner">
      <div class="auth-logo">微</div>
      <h1 class="auth-title">加入微信小店对账系统</h1>
      <p class="auth-slogan">注册账号即可创建独立店铺数据空间<br>开启高效对账与利润核算之旅</p>
      <ul class="auth-features">
        <li>独立数据空间，多店铺互不干扰</li>
        <li>Excel 一键导入，自动标准化对账</li>
        <li>经营全景看板，利润趋势随时掌握</li>
      </ul>
    </div>
  </aside>
  <main class="auth-main">
    <div class="auth-card wide">
      <div class="brand"><span class="logo">微</span>微信小店对账</div>
      <div class="sub">注册账号并创建你的独立店铺数据空间</div>

      <form class="auth-form" id="register-form">
        <div>
          <label for="username">用户名</label>
          <input id="username" type="text" autocomplete="username" placeholder="3-32 位字母、数字、下划线、连字符或点">
        </div>
        <div>
          <label for="password">登录密码</label>
          <input id="password" type="password" autocomplete="new-password" placeholder="至少 8 位，且同时包含字母和数字">
        </div>
        <div>
          <label for="confirm">确认密码</label>
          <input id="confirm" type="password" autocomplete="new-password" placeholder="再次输入登录密码">
          <div class="pwd-match-hint" id="pwd-match" aria-live="polite"></div>
        </div>
        <div>
          <label for="store-name">店铺名称</label>
          <input id="store-name" type="text" placeholder="用于标识你的数据空间，1-64 个字符">
        </div>

        <div id="register-error" class="auth-error"></div>
        <button class="btn auth-btn" id="register-btn" type="submit">注 册</button>
      </form>

      <div id="register-ok" class="auth-ok"></div>
      <div class="auth-alt"><a href="/login">已有账号？返回登录</a></div>
    </div>
  </main>
</div>

<script src="/static/api.js"></script>
<script>
const form = document.getElementById("register-form");
const errBox = document.getElementById("register-error");
const okBox = document.getElementById("register-ok");
const btn = document.getElementById("register-btn");

setupPasswordToggle(document.getElementById("password"), "显示或隐藏登录密码");
setupPasswordToggle(document.getElementById("confirm"), "显示或隐藏确认密码");
bindPasswordMatch({
  newInput: document.getElementById("password"),
  confirmInput: document.getElementById("confirm"),
  hintEl: document.getElementById("pwd-match"),
  submitBtn: btn,
});

form.addEventListener("submit", async e => {
  e.preventDefault();
  errBox.style.display = "none";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  const confirm = document.getElementById("confirm").value;
  const storeName = document.getElementById("store-name").value.trim();
  if (!username) { showErr("请输入用户名"); return; }
  if (!password) { showErr("请输入登录密码"); return; }
  if (!confirm) { showErr("请再次输入密码"); return; }
  if (password !== confirm) { showErr("两次输入的密码不一致"); return; }
  if (!storeName) { showErr("请输入店铺名称"); return; }
  btn.disabled = true;
  btn.textContent = "注册中…";
  try {
    const data = await API.post("/api/auth/register", {
      username, password, confirm_password: confirm, store_name: storeName,
    });
    form.style.display = "none";
    okBox.style.display = "block";
    okBox.innerHTML =
      `注册成功！<br>用户名：<b>${esc(data.username)}</b><br>店铺：<b>${esc(data.store_name)}</b><br>` +
      `<a href="/login">点此前往登录</a>`;
  } catch (ex) {
    showErr(ex.message || "注册失败，请稍后重试");
    btn.disabled = false;
    btn.textContent = "注 册";
  }
});

function showErr(msg) {
  errBox.textContent = msg;
  errBox.style.display = "block";
}
</script>
</body>
</html>
