<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>退款订单 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!--@app-shell-->
  <nav class="page-subnav" aria-label="退款模块">
    <a href="/refund-orders" class="current" aria-current="page">退款订单</a>
    <span class="page-subnav-tab muted" title="在列表中点击「详情」可查看逐笔退款明细">退款明细（详情）</span>
  </nav>
  <div class="page-title">退款订单</div>
  <div class="page-desc">展示所有存在退款记录的订单（同一原订单仅一行汇总，多笔退款在详情逐笔展示）。月份筛选默认按退款申请时间归属；退款申请时间缺失时回退下单时间（跨月退款不漏记），成功退款金额另按退款成功时间单独统计。</div>

  <div class="card">
    <div class="list-filters">
      <div id="month-filter"></div>
      <div id="store-scope"></div>
    </div>
  </div>

  <div class="stat-grid" id="stat-grid"></div>

  <div class="card">
    <div class="filter-grid">
      <div class="filter-item"><label>订单号（精确）</label><input id="f-order-id" placeholder="输入完整订单号"></div>
      <div class="filter-item"><label>订单号关键词</label><input id="f-keyword" placeholder="订单号包含"></div>
      <div class="filter-item"><label>退款状态</label>
        <select id="f-status">
          <option value="">全部</option>
          <option value="pending">退款处理中</option>
          <option value="partial">部分退款</option>
          <option value="full">全额退款</option>
          <option value="closed">退款关闭</option>
          <option value="unknown">未知/待核对</option>
        </select>
      </div>
      <div class="filter-item"><label>时间口径</label>
        <select id="f-time-field">
          <option value="apply_time">退款申请时间（默认）</option>
          <option value="success_time">退款成功时间</option>
          <option value="order_time">下单时间</option>
        </select>
      </div>
      <div class="filter-item"><label>退款金额 ≥</label><input id="f-min" placeholder="0.00"></div>
      <div class="filter-item"><label>退款金额 ≤</label><input id="f-max" placeholder="不限"></div>
      <div class="filter-item"><label>排序字段</label>
        <select id="f-order-by">
          <option value="order_time">下单时间</option>
          <option value="refund_amount">退款总额</option>
          <option value="order_id">订单号</option>
          <option value="actual_received_amount">实收金额</option>
        </select>
      </div>
      <div class="filter-item"><label>方向</label>
        <select id="f-order-dir"><option value="desc">降序</option><option value="asc">升序</option></select>
      </div>
      <div class="filter-actions">
        <button class="btn" id="btn-query">查询</button>
        <button class="btn secondary" id="btn-reset">重置</button>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-head"><h3 style="margin:0">退款订单列表（按订单去重）</h3>
      <div class="head-actions">
        <span class="hint" id="table-hint"></span>
        <button class="btn secondary" id="btn-export">导出当前筛选</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="refund-table"><thead></thead><tbody></tbody></table>
    </div>
    <div id="table-state"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

</div>
<script src="/static/api.js"></script>
<script src="/static/filter_system.js"></script>
<script src="/static/common_table.js"></script>
<script src="/static/data_table.js"></script>
<script src="/static/list_page.js"></script>
<script src="/static/modal.js"></script>
<script src="/static/order_detail.js"></script>
<script src="/static/auth_nav.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/month_filter.js"></script>
<script src="/static/store_scope.js"></script>
<script>
const TIME_FIELD_LABEL = {
  apply_time: "退款申请时间（缺失回退下单时间）",
  success_time: "退款成功时间",
  order_time: "下单时间",
};

const REFUND_PAGE = new ListPage({
  tableId: "refund-table",
  useDataTable: true,
  sortFilterIds: { field: "f-order-by", dir: "f-order-dir" },
  url: "/api/refund-orders",
  itemsKey: "orders",
  rowKey: "order_id",
  pageSize: 50,
  timeLabel: "退款申请时间（缺失回退下单时间）",
  exportUrl: "/api/refund-orders/export",
  filters: [
    { id: "f-order-id", param: "order_id" },
    { id: "f-keyword", param: "keyword" },
    { id: "f-status", param: "status" },
    { id: "f-time-field", param: "time_field", always: true, reset: "apply_time" },
    { id: "f-min", param: "min_amount" },
    { id: "f-max", param: "max_amount" },
    { id: "f-order-by", param: "order_by", always: true, reset: "order_time" },
    { id: "f-order-dir", param: "order_dir", always: true, reset: "desc" },
  ],
  columns: [
    { key: "order_id", title: "订单号", type: "orderId", sortable: "order_id", minWidth: 160 },
    { key: "order_time", title: "下单时间", type: "datetime", sortable: "order_time",
      render: r => fmtTime(r.order_time) },
    { key: "refund_apply_time", title: "退款申请时间", type: "datetime", render: r => {
      const rf = r.refund || {};
      const applyT = rf.refund_apply_time;
      const fallback = rf.refund_apply_time_source === "order_time_fallback";
      if (!applyT) return "—";
      return fallback
        ? `<span class="amount amount--warning" title="退款申请时间缺失，已回退下单时间">${fmtTime(applyT)} ⚠</span>`
        : fmtTime(applyT);
    } },
    { key: "order_status", title: "订单状态", type: "status",
      render: r => orderStatusBadge(r.order_status) },
    { key: "refund_status", title: "退款状态", type: "status",
      render: r => refundStatusBadge((r.refund || {}).refund_status) },
    { key: "refund_amount", title: "退款总额", type: "amount", sortable: "refund_amount",
      render: r => DataTable.format.amount((r.refund || {}).refund_amount, "danger") },
    { key: "success_amt", title: "成功金额", type: "amount",
      render: r => DataTable.format.amount((r.refund_by_status || {}).success, "success") },
    { key: "pending_amt", title: "处理中金额", type: "amount",
      render: r => DataTable.format.amount((r.refund_by_status || {}).pending, "warning") },
    { key: "closed_amt", title: "关闭金额", type: "amount",
      render: r => DataTable.format.amount((r.refund_by_status || {}).closed, "muted") },
    { key: "refund_count", title: "笔数", align: "right",
      render: r => (r.refund || {}).refund_count },
    { key: "granularity", title: "粒度", render: r => (r.refund || {}).refund_amount_granularity === "unknown"
      ? '<span class="badge orange">粒度待核对</span>' : '<span class="badge gray">商品行级</span>' },
    { key: "status_source", title: "状态来源",
      render: r => statusSourceBadge((r.refund || {}).status_source) },
    { key: "actual_received", title: "实收金额", type: "amount", sortable: "actual_received_amount",
      render: r => DataTable.format.amount(r.amounts.actual_received_amount) },
    { key: "pending_review", title: "待核对",
      render: r => r.pending_review ? '<span class="badge red">待核对</span>' : "—" },
    { key: "_op", title: "操作", fixed: "right", render: r =>
      `<button class="link-btn" type="button" data-detail="${esc(r.order_id)}">详情</button>` },
  ],
  stats: s => {
    if (!s) return "";
    const fallback = s.apply_time_fallback_count || 0;
    return renderStatCards(null, [
      ["退款订单数（去重）", s.refund_order_count, ""],
      ["退款总金额", fmtMoneyYuan(s.total_refund_amount), "danger"],
      ["成功退款金额", fmtMoneyYuan(s.success_refund_amount), "success"],
      ["成功退款金额（按成功时间）", fmtMoneyYuan(s.success_refund_amount_by_success_time), "success"],
      ["退款处理中金额", fmtMoneyYuan(s.pending_refund_amount), "warn"],
      ["退款关闭金额", fmtMoneyYuan(s.closed_refund_amount), ""],
      ["部分退款订单", s.partial_refund_order_count, ""],
      ["全额退款订单", s.full_refund_order_count, ""],
      ["退款待核对", s.pending_review_count, s.pending_review_count ? "warn" : ""],
      ["申请时间回退订单", fallback ? `${fallback} 笔 ⚠` : "0", fallback ? "warn" : "",
        "", fallback ? "这些订单缺失退款申请时间，时间归属已回退为下单时间（跨月退款保护）" : ""],
    ], `当前时间口径：${TIME_FIELD_LABEL[s.time_field] || s.time_field}；「成功退款金额（按成功时间）」按退款成功时间独立统计，跨月退款归属到成功发生月份。`);
  },
  emptyHtml: mf =>
    `<div class="empty-state"><div class="icon">🔄</div>当前筛选（${esc(mf.getLabel())}）内没有退款订单<br>
     <span style="font-size:12px">可先在「数据导入」页导入微信订单 Excel，或切换月份/时间口径</span></div>`,
});

document.querySelector("#refund-table tbody").addEventListener("click", e => {
  const detail = e.target.closest("[data-detail]");
  if (detail) openOrderDetail(detail.dataset.detail, { mode: "refund" });
});

REFUND_PAGE.reload();
</script>
</body>
</html>
