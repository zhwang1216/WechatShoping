<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普通订单 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!--@app-shell-->
  <div class="page-title">普通订单</div>
  <div class="page-desc">默认只展示无任何退款记录的订单；存在退款的订单请前往「退款订单」页面。月份筛选按订单下单时间归属（左闭右开区间）。</div>

  <div class="card">
    <div class="list-filters">
      <div id="month-filter"></div>
      <div id="store-scope"></div>
    </div>
  </div>

  <div class="stat-grid" id="stat-grid"></div>

  <div class="card">
    <div class="filter-grid">
      <div class="filter-item"><label>订单号（精确）</label><input id="f-order-id" placeholder="输入完整订单号"></div>
      <div class="filter-item"><label>订单号关键词</label><input id="f-keyword" placeholder="订单号包含"></div>
      <div class="filter-item"><label>订单状态</label>
        <select id="f-status"><option value="">全部</option></select>
      </div>
      <div class="filter-item"><label>排序字段</label>
        <select id="f-order-by">
          <option value="order_time">下单时间</option>
          <option value="order_id">订单号</option>
          <option value="actual_received_amount">实收金额</option>
        </select>
      </div>
      <div class="filter-item"><label>方向</label>
        <select id="f-order-dir"><option value="desc">降序</option><option value="asc">升序</option></select>
      </div>
      <div class="filter-actions">
        <button class="btn" id="btn-query">查询</button>
        <button class="btn secondary" id="btn-reset">重置</button>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-head"><h3 style="margin:0">订单列表</h3>
      <div class="head-actions">
        <span class="hint" id="table-hint"></span>
        <button class="btn secondary" id="btn-export">导出当前筛选</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="orders-table"><thead></thead><tbody></tbody></table>
    </div>
    <div id="table-state"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

</div>
<script src="/static/api.js"></script>
<script src="/static/filter_system.js"></script>
<script src="/static/common_table.js"></script>
<script src="/static/data_table.js"></script>
<script src="/static/list_page.js"></script>
<script src="/static/modal.js"></script>
<script src="/static/order_detail.js"></script>
<script src="/static/auth_nav.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/month_filter.js"></script>
<script src="/static/store_scope.js"></script>
<script>
/* 订单状态选项统一来自 api.js 的 ORDER_STATUS_META，避免状态文案两处维护 */
document.getElementById("f-status").innerHTML += Object.entries(ORDER_STATUS_META)
  .map(([value, meta]) => `<option value="${value}">${esc(meta[0])}</option>`).join("");

const ORDERS_PAGE = new ListPage({
  tableId: "orders-table",
  useDataTable: true,
  sortFilterIds: { field: "f-order-by", dir: "f-order-dir" },
  url: "/api/orders",
  itemsKey: "orders",
  rowKey: "order_id",
  pageSize: 50,
  timeLabel: "订单下单时间",
  exportUrl: "/api/orders/export",
  filters: [
    { id: "f-order-id", param: "order_id" },
    { id: "f-keyword", param: "keyword" },
    { id: "f-status", param: "status" },
    { id: "f-order-by", param: "order_by", always: true, reset: "order_time" },
    { id: "f-order-dir", param: "order_dir", always: true, reset: "desc" },
  ],
  columns: [
    { key: "order_id", title: "订单号", type: "orderId", sortable: "order_id", minWidth: 160 },
    { key: "order_time", title: "下单时间", type: "datetime", sortable: "order_time",
      render: r => fmtTime(r.order_time) },
    { key: "order_status", title: "订单状态", type: "status",
      statusRender: (v, r) => orderStatusBadge(r.order_status) },
    { key: "actual_paid_amount", title: "实际支付", type: "amount",
      render: r => fmtMoney(r.amounts.actual_paid_amount) },
    { key: "actual_received_amount", title: "实际收款", type: "amount", sortable: "actual_received_amount",
      render: r => fmtMoney(r.amounts.actual_received_amount) },
    { key: "technical_service_fee", title: "技术服务费", type: "amount",
      render: r => fmtMoney(r.amounts.technical_service_fee) },
    { key: "product_total", title: "商品总价", type: "amount",
      render: r => fmtMoney(r.amounts.product_total) },
    { key: "product_quantity_total", title: "数量", align: "right",
      render: r => r.product_quantity_total },
    { key: "product_summary", title: "商品明细", ellipsis: true,
      render: r => `<span class="cell-ellipsis" title="${esc(r.product_summary)}">${esc(r.product_summary)}</span>` },
    { key: "batch_ids", title: "导入批次",
      render: r => {
      const ids = r.batch_ids || [];
      return `<span title="${esc(ids.join(", "))}">${ids.length} 个批次</span>`;
    } },
    { key: "_op", title: "操作", fixed: "right", render: r =>
      `<button class="link-btn" type="button" data-detail="${esc(r.order_id)}">详情</button>` },
  ],
  stats: s => s ? renderStatCards(null, [
    ["订单数（去重）", s.order_count, ""],
    ["商品销售额", fmtMoneyYuan(s.product_total_sum), ""],
    ["实际支付金额", fmtMoneyYuan(s.actual_paid_total), ""],
    ["实际收款金额", fmtMoneyYuan(s.actual_received_total), ""],
    ["技术服务费", fmtMoneyYuan(s.technical_service_fee_total), "warn"],
    ["商品总数量", s.quantity_total, ""],
  ]) : "",
  emptyHtml: mf =>
    `<div class="empty-state"><div class="icon">📋</div>当前筛选（${esc(mf.getLabel())}）内没有普通订单<br>
     <span style="font-size:12px">可先在「数据导入」页导入微信订单 Excel，或切换月份/选择「全部」</span></div>`,
});

document.querySelector("#orders-table tbody").addEventListener("click", e => {
  const detail = e.target.closest("[data-detail]");
  if (detail) { openOrderDetail(detail.dataset.detail, { mode: "order" }); return; }
  const copy = e.target.closest("[data-copy]");
  if (copy) copyText(copy.dataset.copy);
});

ORDERS_PAGE.reload();
</script>
</body>
</html>
