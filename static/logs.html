<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>操作日志 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!--@app-shell-->
  <div class="page-title">操作日志</div>
  <div class="page-desc">记录系统全部操作（导入、对账、核算、导出、数据读写、备份恢复等）。月份筛选按操作发生时间（time）归属（左闭右开区间），统计卡片与表格同筛选。</div>

  <div id="month-filter"></div>
  <div id="store-scope"></div>

  <div class="stat-grid" id="stat-grid"></div>

  <div class="card">
    <div class="filter-grid">
      <div class="filter-item"><label>关键词</label><input id="f-keyword" placeholder="动作/操作人/详情包含"></div>
      <div class="filter-item"><label>动作</label><input id="f-action" placeholder="如 import.confirm"></div>
      <div class="filter-item"><label>操作人</label><input id="f-operator" placeholder="如 admin"></div>
      <div class="filter-actions">
        <button class="btn" id="btn-query">查询</button>
        <button class="btn secondary" id="btn-reset">重置</button>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-head"><h3 style="margin:0">日志列表（新→旧）</h3><span class="hint" id="table-hint"></span></div>
    <div class="table-wrap">
      <table id="log-table">
        <thead><tr>
          <th>时间</th><th>动作</th><th>操作人</th><th>结果</th><th>详情</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="table-state"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

</div>
<script src="/static/api.js"></script>
<script src="/static/common_table.js"></script>
<script src="/static/list_page.js"></script>
<script src="/static/auth_nav.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/month_filter.js"></script>
<script src="/static/store_scope.js"></script>
<script>
function fmtDetail(d) {
  if (d === null || d === undefined) return "—";
  if (typeof d === "string") return d;
  try { return JSON.stringify(d); } catch (e) { return String(d); }
}

const LOG_PAGE = new ListPage({
  tableId: "log-table",
  url: "/api/logs",
  itemsKey: "entries",
  rowKey: e => e.record_id || (e.time + "|" + e.action + "|" + (e.operator || "")),
  pageSize: 50,
  timeLabel: "操作发生时间",
  filters: [
    { id: "f-keyword", param: "keyword" },
    { id: "f-action", param: "action" },
    { id: "f-operator", param: "operator" },
  ],
  columns: [
    { title: "时间", render: e => `<span style="white-space:nowrap">${fmtTime(e.time)}</span>` },
    { title: "动作", render: e => `<span class="badge blue">${esc(e.action)}</span>` },
    { title: "操作人", render: e => esc(e.operator || "—") },
    { title: "结果", render: e => e.result === "error"
      ? '<span class="badge red">失败</span>'
      : '<span class="badge green">成功</span>' },
    { title: "详情", render: e =>
      `<span style="display:block;max-width:520px;white-space:normal;font-size:12px;color:var(--text-light)">${esc(fmtDetail(e.detail))}</span>` },
  ],
  stats: s => s ? renderStatCards(null, [
    ["日志条数", s.entry_count, ""],
    ["操作人数", s.operator_count, ""],
    ["失败操作", s.error_count, s.error_count ? "danger" : "success"],
  ], "时间口径：操作发生时间（time 字段）。") : "",
  emptyHtml: mf =>
    `<div class="empty-state"><div class="icon">🗂</div>当前筛选（${esc(mf.getLabel())}）内没有日志记录<br>
     <span style="font-size:12px">可切换月份或选择「全部」</span></div>`,
});

LOG_PAGE.reload();
</script>
</body>
</html>
