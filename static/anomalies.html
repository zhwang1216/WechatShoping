<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>异常处理 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<!--@app-shell-->
  <div class="page-title">异常记录处理</div>
  <div class="page-desc">集中展示导入校验异常、对账异常（未匹配订单/金额差异/数量差异等）与利润风险。月份筛选按异常发现时间（记录生成时间）归属（左闭右开区间）；异常的解决请在对应业务页面操作（对账成本/利润核算），重跑后会自动关闭已修复的异常。</div>

  <div id="month-filter"></div>
  <div id="store-scope"></div>

  <div class="stat-grid" id="stat-grid"></div>

  <div class="card">
    <div class="filter-grid">
      <div class="filter-item"><label>关键词</label><input id="f-keyword" placeholder="异常信息/订单号/类型"></div>
      <div class="filter-item"><label>处理状态</label>
        <select id="f-status"><option value="">全部</option></select>
      </div>
      <div class="filter-item"><label>异常类型</label>
        <select id="f-type"><option value="">全部</option></select>
      </div>
      <div class="filter-item"><label>级别</label>
        <select id="f-severity"><option value="">全部</option></select>
      </div>
      <div class="filter-item"><label>订单号（精确）</label><input id="f-order-id" placeholder="输入完整订单号"></div>
      <div class="filter-actions">
        <button class="btn" id="btn-query">查询</button>
        <button class="btn secondary" id="btn-reset">重置</button>
      </div>
    </div>
  </div>

  <div class="card table-card">
    <div class="card-head"><h3 style="margin:0">异常记录列表</h3>
      <div class="head-actions">
        <span class="hint" id="table-hint"></span>
        <button class="btn secondary" id="btn-export">导出当前筛选</button>
      </div>
    </div>
    <div class="table-wrap">
      <table id="anomaly-table">
        <thead><tr>
          <th>发现时间</th><th>异常类型</th><th>级别</th><th>状态</th>
          <th>关联订单</th><th>异常信息</th><th>处理结果</th><th>批次</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="table-state"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>

</div>
<script src="/static/api.js"></script>
<script src="/static/common_table.js"></script>
<script src="/static/list_page.js"></script>
<script src="/static/auth_nav.js"></script>
<script src="/static/sidebar.js"></script>
<script src="/static/month_filter.js"></script>
<script src="/static/store_scope.js"></script>
<script>
const SEVERITY_META = { high: ["高", "red"], medium: ["中", "orange"], low: ["低", "gray"] };
const STATUS_META = { pending_review: ["待处理", "red"], resolved: ["已解决", "green"] };

function sevBadge(s) {
  const [label, color] = SEVERITY_META[s] || [s || "—", "gray"];
  return `<span class="badge ${color}">${esc(label)}</span>`;
}
function stBadge(s) {
  const [label, color] = STATUS_META[s] || [s || "—", "gray"];
  return `<span class="badge ${color}">${esc(label)}</span>`;
}

const ANOMALY_PAGE = new ListPage({
  tableId: "anomaly-table",
  url: "/api/anomalies",
  itemsKey: "anomalies",
  rowKey: "record_id",
  pageSize: 50,
  timeLabel: "异常发现时间（记录生成时间）",
  exportUrl: "/api/anomalies/export",
  filters: [
    { id: "f-keyword", param: "keyword" },
    { id: "f-status", param: "status" },
    { id: "f-type", param: "exception_type" },
    { id: "f-severity", param: "severity" },
    { id: "f-order-id", param: "order_id" },
  ],
  columns: [
    { title: "发现时间", render: a => fmtTime(a.created_at) },
    { title: "异常类型", render: a => `<span class="badge gray">${esc(a.exception_type)}</span>` },
    { title: "级别", render: a => sevBadge(a.severity) },
    { title: "状态", render: a => stBadge(a.status) },
    { title: "关联订单", render: a => a.order_id ? esc(a.order_id) : "—" },
    { title: "异常信息", render: a => {
      const msg = a.message || "—";
      return `<span style="display:block;max-width:320px;white-space:normal" title="${esc(msg)}">${esc(msg)}</span>`;
    } },
    { title: "处理结果", render: a => {
      const res = a.resolution || {};
      const text = typeof res === "object" ? (res.note || res.status || "—") : String(res || "—");
      return `<span style="display:block;max-width:180px;white-space:normal;font-size:12px">${esc(text)}</span>`;
    } },
    { title: "批次", render: a => {
      const key = a.batch_id || a.reconciliation_id || "—";
      return `<span style="font-size:12px" title="${esc(a.batch_id || "")}${a.reconciliation_id ? " / " + esc(a.reconciliation_id) : ""}">${esc(String(key).slice(0, 12))}…</span>`;
    } },
  ],
  stats: s => s ? renderStatCards(null, [
    ["异常总数", s.anomaly_count, ""],
    ["待处理", s.pending_count, s.pending_count ? "danger" : "success"],
    ["已解决", s.resolved_count, "success"],
    ["高危异常", s.high_severity_count, s.high_severity_count ? "warn" : ""],
  ], "时间口径：异常发现时间（记录生成时间 created_at）。") : "",
  emptyHtml: mf =>
    `<div class="empty-state"><div class="icon">✅</div>当前筛选（${esc(mf.getLabel())}）内没有异常记录<br>
     <span style="font-size:12px">可切换月份或选择「全部」查看历史异常</span></div>`,
});

async function loadOptions() {
  try {
    const options = await API.get("/api/anomalies/options");
    const st = document.getElementById("f-status");
    const tp = document.getElementById("f-type");
    const sv = document.getElementById("f-severity");
    st.innerHTML += Object.entries(options.status)
      .map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
    tp.innerHTML += Object.entries(options.exception_types)
      .map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
    sv.innerHTML += Object.entries(options.severity)
      .map(([v, l]) => `<option value="${v}">${l}</option>`).join("");
  } catch (e) { /* 选项加载失败不阻塞列表 */ }
}

loadOptions().then(() => ANOMALY_PAGE.reload());
</script>
</body>
</html>
