<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 - 微信小店对账与利润核算系统</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="auth-wrap">
  <aside class="auth-banner">
    <div class="auth-banner-deco d1"></div>
    <div class="auth-banner-deco d2"></div>
    <div class="auth-banner-deco d3"></div>
    <div class="auth-banner-inner">
      <div class="auth-logo">微</div>
      <h1 class="auth-title">微信小店对账与利润核算系统</h1>
      <p class="auth-slogan">精准对账 · 清晰利润 · 高效经营<br>让每一笔订单都有迹可循</p>
      <ul class="auth-features">
        <li>多店铺数据隔离，独立核算互不干扰</li>
        <li>订单与成本自动对账，异常实时预警</li>
        <li>利润多维度分析，经营全景一目了然</li>
      </ul>
    </div>
  </aside>
  <main class="auth-main">
    <div class="auth-card">
      <div class="brand"><span class="logo">微</span>微信小店对账</div>
      <div class="sub">欢迎回来，请登录你的账号</div>
      <form class="auth-form" id="login-form">
        <div>
          <label for="username">账号</label>
          <input id="username" name="username" autocomplete="username" autofocus placeholder="请输入账号">
        </div>
        <div>
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码">
        </div>
        <div id="login-error" class="auth-error"></div>
        <button class="btn auth-btn" id="login-btn" type="submit">登 录</button>
      </form>
      <div class="auth-alt">还没有账号？<a href="/register">立即注册</a></div>
    </div>
  </main>
</div>

<script src="/static/api.js"></script>
<script>
const form = document.getElementById("login-form");
const errBox = document.getElementById("login-error");
const btn = document.getElementById("login-btn");

setupPasswordToggle(document.getElementById("password"), "显示或隐藏登录密码");

try {
  const notice = sessionStorage.getItem("login_notice");
  if (notice) {
    sessionStorage.removeItem("login_notice");
    errBox.textContent = notice;
    errBox.style.background = "#f0fdf4";
    errBox.style.color = "var(--success)";
    errBox.style.display = "block";
  }
} catch (e) { /* sessionStorage 不可用时忽略 */ }

form.addEventListener("submit", async e => {
  e.preventDefault();
  errBox.style.display = "none";
  errBox.style.background = "#fef2f2";
  errBox.style.color = "var(--danger)";
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  if (!username || !password) {
    errBox.textContent = "请输入账号和密码";
    errBox.style.display = "block";
    return;
  }
  btn.disabled = true;
  btn.textContent = "登录中…";
  try {
    await API.post("/api/auth/login", { username, password });
    location.href = "/dashboard";
  } catch (ex) {
    errBox.textContent = ex.message || "登录失败，请稍后重试";
    errBox.style.display = "block";
    btn.disabled = false;
    btn.textContent = "登 录";
  }
});
</script>
</body>
</html>
